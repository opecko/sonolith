[package]
name = "sonolith"
version = "2.2.0"
edition = "2021"
description = "Lightweight YouTube Music desktop client"
authors = ["opecko"]
license = "MIT"
repository = "https://github.com/opecko/sonolith"

[lib]
name = "sonolith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2.0"
url = "2.5.8"
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }
tauri-plugin-opener = "2"
sha2 = "0.10"
dirs = "7"
base64 = "0.22"
roxmltree = "0.20"
tauri-plugin-single-instance = "2.5.3"
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "memmap", "fontconfig"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
# Same version tray-icon uses: its AppIndicator gets a title (tray.rs).
libappindicator = "0.9"
zbus = "5"
