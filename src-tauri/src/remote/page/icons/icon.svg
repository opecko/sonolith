<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Phone remote icon: a TV remote whose big button is Sonolith's logo. Full-bleed background, artwork inside the
       central 80 % so it also works as a maskable icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f24"/>
      <stop offset="1" stop-color="#121014"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3740"/>
      <stop offset="1" stop-color="#26232a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Signal waves toward the TV -->
  <g fill="none" stroke="#ff0033" stroke-width="16" stroke-linecap="round" opacity="0.9">
    <path d="M318 112 a52 52 0 0 1 52 52"/>
    <path d="M318 74 a90 90 0 0 1 90 90" opacity="0.55"/>
  </g>
  <g transform="rotate(-18 236 288)">
    <rect x="156" y="112" width="160" height="330" rx="64" fill="url(#body)" stroke="#55505c" stroke-width="6"/>
    <!-- IR window -->
    <rect x="216" y="128" width="40" height="10" rx="5" fill="#ff0033" opacity="0.8"/>
    <!-- Sonolith logo as the main button -->
    <circle cx="236" cy="222" r="56" fill="#ff0033"/>
    <path d="M220 196 L262 222 L220 248 Z" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <!-- Small buttons -->
    <g fill="#5a5562">
      <circle cx="196" cy="318" r="14"/><circle cx="236" cy="318" r="14"/><circle cx="276" cy="318" r="14"/>
      <circle cx="196" cy="362" r="14"/><circle cx="236" cy="362" r="14"/><circle cx="276" cy="362" r="14"/>
      <rect x="206" y="396" width="60" height="16" rx="8"/>
    </g>
  </g>
</svg>
